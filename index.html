<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Trading Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        .chart-container {
            margin: 20px 0;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Trading Report</h1>
        <div class="chart-container">
            <canvas id="dailyGainLossChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="totalGainLossChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="portfolioDistributionChart"></canvas>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <script>
        // Function to format date to YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Get today's date
        const today = new Date();
        const formattedDate = formatDate(today);

        // Fetch the report data
        fetch(`reports/daily_report_${formattedDate}.json`)
            .then(response => response.json())
            .then(data => {
                // Daily Gain/Loss Chart
                const dailyGainLossCtx = document.getElementById('dailyGainLossChart').getContext('2d');
                new Chart(dailyGainLossCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.daily_gain_loss),
                        datasets: [{
                            label: 'Daily Gain/Loss (US$)',
                            data: Object.values(data.daily_gain_loss),
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

                // Total Gain/Loss Chart
                const totalGainLossCtx = document.getElementById('totalGainLossChart').getContext('2d');
                new Chart(totalGainLossCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.total_gain_loss),
                        datasets: [{
                            label: 'Total Gain/Loss (US$)',
                            data: Object.values(data.total_gain_loss),
                            backgroundColor: 'rgba(153, 102, 255, 0.2)',
                            borderColor: 'rgba(153, 102, 255, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

                // Portfolio Distribution Chart
                const portfolioDistributionCtx = document.getElementById('portfolioDistributionChart').getContext('2d');
                new Chart(portfolioDistributionCtx, {
                    type: 'pie',
                    data: {
                        labels: Object.keys(data.portfolio_distribution),
                        datasets: [{
                            label: 'Portfolio Distribution',
                            data: Object.values(data.portfolio_distribution),
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.2)',
                                'rgba(54, 162, 235, 0.2)',
                                'rgba(255, 206, 86, 0.2)',
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 159, 64, 0.2)'
                            ],
                            borderColor: [
                                'rgba(255, 99, 132, 1)',
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(75, 192, 192, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 159, 64, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true
                    }
                });
            });
    </script>
</body>
</html>
